<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>CampusIQ - Extraction Review</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Theme Configuration -->
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-tertiary-fixed-variant": "#6e3900",
                    "surface-tint": "#1353d8",
                    "on-secondary-fixed-variant": "#005137",
                    "surface-container-low": "#f0f3ff",
                    "surface-container-high": "#e2e8f8",
                    "inverse-on-surface": "#ebf1ff",
                    "surface-container-lowest": "#ffffff",
                    "on-tertiary": "#ffffff",
                    "primary-fixed": "#dbe1ff",
                    "error-container": "#ffdad6",
                    "on-secondary": "#ffffff",
                    "secondary-fixed-dim": "#68dba9",
                    "on-primary-fixed-variant": "#003dab",
                    "secondary-container": "#82f5c1",
                    "on-primary-container": "#d4dcff",
                    "surface-variant": "#dce2f3",
                    "tertiary": "#723b00",
                    "on-secondary-fixed": "#002114",
                    "tertiary-fixed": "#ffdcc3",
                    "surface": "#f9f9ff",
                    "on-primary-fixed": "#00174d",
                    "surface-dim": "#d3daea",
                    "inverse-surface": "#2a313d",
                    "primary-fixed-dim": "#b5c4ff",
                    "tertiary-container": "#954f00",
                    "error": "#ba1a1a",
                    "on-tertiary-container": "#ffd5b6",
                    "on-error": "#ffffff",
                    "on-surface-variant": "#434654",
                    "tertiary-fixed-dim": "#ffb77d",
                    "on-surface": "#151c27",
                    "surface-container": "#e7eefe",
                    "on-primary": "#ffffff",
                    "secondary": "#006c4a",
                    "on-secondary-container": "#00714e",
                    "primary": "#003fb1",
                    "inverse-primary": "#b5c4ff",
                    "on-tertiary-fixed": "#2f1500",
                    "on-error-container": "#93000a",
                    "outline": "#737686",
                    "primary-container": "#1a56db",
                    "surface-container-highest": "#dce2f3",
                    "on-background": "#151c27",
                    "outline-variant": "#c3c5d7",
                    "secondary-fixed": "#85f8c4",
                    "surface-bright": "#f9f9ff",
                    "background": "#f9f9ff"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "unit": "4px",
                    "margin-desktop": "32px",
                    "gutter": "24px",
                    "container-max": "1440px",
                    "margin-mobile": "16px"
            },
            "fontFamily": {
                    "body-lg": ["Inter", "sans-serif"],
                    "body-sm": ["Inter", "sans-serif"],
                    "headline-xl": ["Inter", "sans-serif"],
                    "headline-md": ["Inter", "sans-serif"],
                    "headline-lg-mobile": ["Inter", "sans-serif"],
                    "headline-lg": ["Inter", "sans-serif"],
                    "label-md": ["Inter", "sans-serif"],
                    "body-md": ["Inter", "sans-serif"],
                    "label-sm": ["Inter", "sans-serif"],
                    "code-md": ["jetbrainsMono", "monospace"]
            },
            "fontSize": {
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                    "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "headline-xl": ["36px", {"lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "headline-lg": ["28px", {"lineHeight": "36px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "code-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}]
            }
          }
        }
      }
    </script>
<style>
        /* Hide scrollbar for clean mobile look but allow scrolling */
        ::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
        
        /* Input focus styles overriding default tailwind form rings to match brand */
        input:focus {
            outline: none;
            box-shadow: 0 0 0 2px #003fb1; /* primary color */
            border-color: transparent;
        }
        
        /* Specific amber focus for low confidence fields */
        .amber-input:focus {
            box-shadow: 0 0 0 2px #723b00; /* tertiary color */
        }
    </style>
</head>
<body class="bg-surface text-on-surface font-body-md text-body-md antialiased min-h-screen flex flex-col">
<!-- Task-Focused Header (Navigation Shell Suppressed per rules for transactional page) -->
<header class="sticky top-0 z-40 bg-surface/90 backdrop-blur-md border-b border-outline-variant flex items-center justify-between px-margin-mobile h-16">
<button class="text-on-surface-variant hover:text-primary transition-colors flex items-center justify-center p-2 -ml-2 rounded-full active:bg-surface-variant">
<span class="material-symbols-outlined" data-weight="regular">close</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-surface absolute left-1/2 -translate-x-1/2 w-max">Review Extraction</h1>
<div class="w-8"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 overflow-y-auto w-full max-w-[600px] mx-auto pb-32"> <!-- pb-32 to clear sticky bottom bar -->
<!-- Source Preview Section -->
<section class="p-margin-mobile">
<div class="relative w-full h-48 bg-surface-container-high rounded-xl overflow-hidden shadow-sm border border-outline-variant cursor-zoom-in group">
<img class="w-full h-full object-cover opacity-90 transition-transform duration-300 group-active:scale-105" data-alt="A brightly lit, slightly crumpled academic timetable printed on premium white paper, resting on a clean wooden desk. The photograph is taken from a top-down perspective with a modern smartphone camera style, displaying a clear structure of days and times in a minimalist, corporate aesthetic grid layout with sharp black text and subtle blue header accents." src="https://lh3.googleusercontent.com/aida-public/AB6AXuA2w25IG1WqreVX2sVlmnczYilJT2MH1r-KvoafnwyNwjrDRpL2Xg5WMKsBkrG6AujVivBGj7NIkVFyHxFNfW0EItBMdNuCYzqLKyEvclqviVHa2Lr97EUDp0sZGQIg7ctFvPcKt7UeTenL4EMIGkGn8zud5DqDmeoNtdJ3268gLCg2Hj8epUJIzmvqH6r1rxziCYFnDRsu_5IAtRxiRdV5ElWERuyyvAaYDGrY8z2S9rlDQZ7mVJ3I">
<!-- Zoom Affordance -->
<div class="absolute bottom-margin-mobile right-margin-mobile bg-inverse-surface/80 text-inverse-on-surface backdrop-blur-sm px-3 py-1.5 rounded-full flex items-center gap-1">
<span class="material-symbols-outlined text-[18px]">zoom_in</span>
<span class="font-label-sm text-label-sm">Tap to view</span>
</div>
</div>
</section>
<!-- Editable List Section -->
<section class="px-margin-mobile pb-margin-mobile">
<div class="flex items-center justify-between mb-margin-mobile mt-gutter">
<h2 class="font-label-md text-label-md text-on-surface-variant">Extracted Fields</h2>
<span class="font-label-sm text-label-sm text-secondary flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">check_circle</span>
                    Auto-saved
                </span>
</div>
<div class="flex flex-col gap-margin-mobile">
<!-- Field 1: High Confidence -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-lg p-margin-mobile shadow-sm focus-within:border-primary transition-colors relative"><button class="absolute top-margin-mobile right-margin-mobile text-on-surface-variant hover:text-primary transition-colors p-1 rounded-full active:bg-surface-variant"><span class="material-symbols-outlined text-[18px]">edit</span></button>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-1 uppercase tracking-wider" for="field-day">Day &amp; Time</label>
<input class="w-full bg-transparent border-b border-outline-variant py-2 font-body-lg text-body-lg text-on-surface placeholder-outline-variant transition-colors rounded-t-sm" id="field-day" type="text" value="Monday, 9:00 AM">
</div>
<!-- Field 2: High Confidence -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-lg p-margin-mobile shadow-sm focus-within:border-primary transition-colors relative"><button class="absolute top-margin-mobile right-margin-mobile text-on-surface-variant hover:text-primary transition-colors p-1 rounded-full active:bg-surface-variant"><span class="material-symbols-outlined text-[18px]">edit</span></button>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-1 uppercase tracking-wider" for="field-course">Course Code</label>
<input class="w-full bg-transparent border-b border-outline-variant py-2 font-body-lg text-body-lg text-on-surface placeholder-outline-variant transition-colors rounded-t-sm" id="field-course" type="text" value="CS101">
</div>
<!-- Field 3: Low Confidence (Soft Amber Highlight using tertiary-fixed per theme rules) -->
<div class="bg-tertiary-fixed border border-tertiary-fixed-dim rounded-lg p-margin-mobile shadow-sm relative focus-within:ring-2 focus-within:ring-tertiary transition-all">
<!-- Warning Badge -->
<button class="absolute top-margin-mobile right-[84px] text-tertiary hover:text-primary transition-colors p-1 rounded-full active:bg-surface-variant"><span class="material-symbols-outlined text-[18px]">edit</span></button><div class="absolute top-margin-mobile right-margin-mobile flex items-center gap-1 text-tertiary bg-tertiary-fixed-dim/30 px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wide">
<span class="material-symbols-outlined text-[14px]">warning</span>
                        Review
                    </div>
<label class="block font-label-sm text-label-sm text-tertiary mb-1 uppercase tracking-wider" for="field-location">Location</label>
<input class="amber-input w-full bg-transparent border-b border-tertiary/50 py-2 font-body-lg text-body-lg text-on-tertiary-fixed-variant placeholder-tertiary/50 transition-colors rounded-t-sm" id="field-location" type="text" value="Room 40??">
</div>
<!-- Field 4: High Confidence -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-lg p-margin-mobile shadow-sm focus-within:border-primary transition-colors relative"><button class="absolute top-margin-mobile right-margin-mobile text-on-surface-variant hover:text-primary transition-colors p-1 rounded-full active:bg-surface-variant"><span class="material-symbols-outlined text-[18px]">edit</span></button>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-1 uppercase tracking-wider" for="field-instructor">Instructor</label>
<input class="w-full bg-transparent border-b border-outline-variant py-2 font-body-lg text-body-lg text-on-surface placeholder-outline-variant transition-colors rounded-t-sm" id="field-instructor" type="text" value="Dr. Alan Turing">
</div>
</div>
</section>
</main>
<!-- Fixed Bottom Actions -->
<div class="fixed bottom-0 left-0 w-full bg-surface border-t border-outline-variant p-margin-mobile shadow-[0_-4px_10px_rgba(0,0,0,0.05)] z-40 max-w-[600px] left-1/2 -translate-x-1/2">
<div class="flex flex-col gap-3">
<!-- Primary Action: Scholar Blue -->
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-4 rounded-full flex items-center justify-center gap-2 active:bg-primary/90 transition-colors shadow-sm">
<span class="material-symbols-outlined text-[20px]">sync</span>
                Confirm &amp; Sync
            </button>
<!-- Secondary Action: Ghost/Bordered -->
<button class="w-full bg-surface-container-lowest border border-outline-variant text-primary font-label-md text-label-md py-3.5 rounded-full flex items-center justify-center gap-2 active:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-[20px]">photo_camera</span>
                Retake Photo
            </button>
</div>
</div>


</body></html>
